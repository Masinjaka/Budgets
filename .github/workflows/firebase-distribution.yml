# .github/workflows/firebase-distribution.yml

name: Build and Distribute to Firebase

on:
  push:
    branches:
      - main # This workflow triggers on pushes to the main branch

jobs:
  build_and_distribute_android:
    runs-on: ubuntu-latest # Use a Linux environment for the job

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Setup Java environment, required for Flutter
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Or 'beta', 'dev'

      # 4. Get Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5. Build the Android App Bundle (AAB)
      #    Using AAB is the recommended format for Google Play.
      #    For Firebase App Distribution, an APK is often simpler.
      #    We will build an APK here for simplicity.
      - name: Build Android APK
        run: flutter build apk --release

      # 6. Upload the generated APK as an artifact
      #    This allows you to download the APK from the GitHub Actions run.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 7. Distribute the APK to Firebase App Distribution
      - name: Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          # The service account credentials for your Firebase project
          # Stored as a secret in your GitHub repository settings
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

          # The App ID of your Android app in Firebase
          # Stored as a secret in your GitHub repository settings
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}

          # A file with release notes for your testers
          # Optional, but highly recommended
          releaseNotesFile: "release_notes.txt"

          # You can also specify testers or groups
          # testers: "email1@example.com, email2@example.com"
          groups: "betas"

          file: app/build/outputs/apk/release/app-release.apk