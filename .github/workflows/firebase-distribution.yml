# .github/workflows/firebase-distribution.yml

name: Build and Distribute to Firebase

on:
  push:
    branches:
      - main # This workflow triggers on pushes to the main branch

jobs:
  build_and_distribute_android:
    runs-on: ubuntu-latest # Use a Linux environment for the job

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Setup Java environment, required for Flutter
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc'
          cache: true

      # 4. Get Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5. Run build_runner
      - name: Run build_runner
        run: dart run build_runner build -d

      # 6. Reconstruct the upload key only inside the ephemeral runner.
      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD is missing"; exit 1; }

          keystore_path="$RUNNER_TEMP/drala-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      # 7. Build a signed release APK.
      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=SENTRY_ENVIRONMENT=production

      # 8. Upload the generated APK as an artifact
      #    This allows you to download the APK from the GitHub Actions run.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 9. Distribute the APK to Firebase App Distribution
      - name: Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          # The service account credentials for your Firebase project
          # Stored as a secret in your GitHub repository settings
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

          # The App ID of your Android app in Firebase
          # Stored as a secret in your GitHub repository settings
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}

          # A file with release notes for your testers
          # Optional, but highly recommended
          releaseNotesFile: "release_notes.txt"

          # You can also specify testers or groups
          # testers: "email1@example.com, email2@example.com"
          groups: "betas"

          file: build/app/outputs/flutter-apk/app-release.apk

      - name: Remove temporary signing key
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH:-}"
