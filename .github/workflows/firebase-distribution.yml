# .github/workflows/firebase-distribution.yml

name: Build and Distribute to Firebase

on:
  push:
    branches:
      - main # This workflow triggers on pushes to the main branch

jobs:
  build_and_distribute_android:
    runs-on: ubuntu-latest # Use a Linux environment for the job

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 2. Setup Java environment, required for Flutter
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Or 'beta', 'dev'

      # 4. Get Flutter dependencies
      - name: Get Flutter dependencies
        run: flutter pub get

      # 5. Build the Android APK
      #    For this workflow, we'll use an APK for simplicity.
      - name: Build Android APK
        run: flutter build apk --release

      # 6. Setup Firebase Tools
      #    This uses the official Firebase action to install the CLI.
      - name: Setup Firebase Tools
        uses: firebase-tools/action-hosting-deploy@v0

      # 7. Distribute the APK to Firebase App Distribution
      - name: Distribute to Firebase
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID_ANDROID }}" \
            --release-notes-file "release_notes.txt" \
            --groups "betas" \
            --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          # The FIREBASE_TOKEN is a special token generated by the CLI for authentication.
          # The service account is still used behind the scenes by the CLI.
          FIREBASE_CLI_PREVIEWS: appdistribution